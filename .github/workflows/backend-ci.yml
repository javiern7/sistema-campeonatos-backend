name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Maven tests with Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Docker preflight
        run: |
          docker version
          docker ps

      - name: Run backend tests
        run: mvn test
